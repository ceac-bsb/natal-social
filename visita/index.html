<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sua visita · Natal Social 2026</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1D6B3A">
<link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../painel/painel.css">
</head><body>
<div class="wrap"><div class="cel" id="app"><p class="vazio">Carregando a visita…</p></div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const db=getFirestore(initializeApp({apiKey:"AIzaSyAfWGepsAcPbwQMVYLZyYtTH4BWglPfCmM",authDomain:"natal-social-ceac.firebaseapp.com",projectId:"natal-social-ceac",appId:"1:1014280497543:web:0a637ed96aa2a4ab1ecb22"}));
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dia=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'';
const fone=z=>z&&z.length>=10?`(${z.slice(0,2)}) ${z.slice(2,-4)}-${z.slice(-4)}`:(z||'');
const zap=(z,t)=>`https://wa.me/55${z}?text=${encodeURIComponent(t)}`;
const primeiro=n=>String(n||'').trim().split(' ')[0];
const transp=p=>p.transporte==='carro'?`<span class="chip c-carro">🚗 carro${p.vagas?` · ${p.vagas} vagas`:''}</span>`:p.transporte==='carona'?`<span class="chip c-carona">precisa de carona</span>`:p.transporte==='proprio'?`<span class="chip c-neutro">vai por conta</span>`:'';
const casa=`<svg viewBox="0 0 160 120" aria-label="Sem foto da fachada"><rect width="160" height="120" fill="var(--verde-claro)"/><path d="M40 92V58l40-28 40 28v34" fill="none" stroke="var(--verde)" stroke-width="5" stroke-linejoin="round"/><rect x="68" y="66" width="24" height="26" fill="none" stroke="var(--verde)" stroke-width="4"/></svg>`;
const erro=m=>{$('#app').innerHTML=`<div class="card"><h3>${m}</h3><p class="sub">Confira se o link veio completo ou fale com quem te mandou.</p></div>`};

async function carregar(){
  const t=location.hash.slice(1);if(!t){erro('Link de visita incompleto.');return}
  let s;try{s=await getDoc(doc(db,'links',t))}catch{erro('Não deu para abrir a visita agora.');return}
  if(!s.exists()){erro('Esta visita não existe mais.');return}
  const v=s.data(),f=v.familia||{},r=v.responsavel||{},eq=v.equipe||[],ent=v.tipo==='entrega';
  const motoristas=eq.filter(p=>p.transporte==='carro'),caronas=eq.filter(p=>p.transporte==='carona');
  document.title=`${ent?'Entrega':'Visita'} ${dia(v.data)} · Natal Social 2026`;
  $('#app').innerHTML=`
   <div class="hero"><small>${ent?'Entrega de Natal':'Visita de reconhecimento'} · Natal Social 2026</small><h1>Sábado, ${dia(v.data)}</h1><p>${esc(f.nome)}</p>
    <div class="horarios"><div><b>${esc(v.saida)}</b><span>saída</span></div><div><b>${esc(v.retorno)}</b><span>retorno previsto</span></div><div><b>${eq.length+1}</b><span>pessoas</span></div></div></div>
   <div class="card bloco"><div class="sub" style="font-weight:700">Ponto de encontro</div><h3 style="margin-top:2px">${esc(v.encontro)}</h3>
    <a class="zap sec" href="${esc(v.encontroMapa||'https://maps.google.com/?q='+encodeURIComponent(v.encontro+' Brasília'))}" target="_blank" rel="noopener">Abrir o ponto de encontro no mapa</a></div>
   <div class="card bloco"><div class="sub" style="font-weight:700">A casa</div>
    <div class="fachada" style="margin-top:8px">${f.foto?`<img src="${f.foto}" alt="Fachada da casa">`:casa}</div>
    <h3 style="margin-top:12px">${esc(f.end)||'Endereço a confirmar'}</h3>
    ${f.mapa?`<a class="zap sec" href="${esc(f.mapa)}" target="_blank" rel="noopener">📍 Como chegar (Google Maps)</a>`:''}</div>
   <div class="card bloco"><div class="sub" style="font-weight:700">Quem vai receber vocês</div><h3 style="margin-top:2px">${esc(f.resp)||'—'}</h3>
    <div class="sub">${[fone(f.zap),f.pessoas?f.pessoas+' pessoas na casa':'',esc(f.criancas)].filter(Boolean).join(' · ')}</div>
    ${f.zap?`<a class="zap" href="${zap(f.zap,`Oi, ${primeiro(f.resp)}! Aqui é do Natal Social do CEAC. Estamos indo te visitar no sábado, ${dia(v.data)}, por volta das ${v.saida}. Tudo certo?`)}" target="_blank" rel="noopener">Mandar mensagem para ${esc(primeiro(f.resp))}</a>`:''}</div>
   <div class="card bloco"><div class="sub" style="font-weight:700">Equipe</div>
    <div class="linha"><div class="min"><b>${esc(r.nome)||'Coordenação'}</b><div class="sub">responsável pela visita</div></div>${r.zap?`<a class="btn peq" href="${zap(r.zap,'Oi! Sobre a visita do Natal Social de '+dia(v.data)+'.')}" target="_blank" rel="noopener">WhatsApp</a>`:''}</div>
    ${eq.map(p=>`<div class="linha"><div class="min"><b>${esc(p.nome)}</b></div>${transp(p)}</div>`).join('')}
    ${motoristas.length&&caronas.length?`<p class="sub" style="margin:10px 0 0">Carona: ${caronas.map(p=>esc(primeiro(p.nome))).join(', ')} ${caronas.length>1?'vão':'vai'} com ${motoristas.map(p=>esc(primeiro(p.nome))).join(' ou ')}.</p>`:''}</div>
   ${ent?`<div class="card bloco"><div class="sub" style="font-weight:700">O que levar</div><ul class="dicas"><li>Cesta básica</li>${f.criancas?`<li>Presentes: ${esc(f.criancas)}</li>`:''}${f.pedidos?`<li>${esc(f.pedidos)}</li>`:''}</ul></div><div class="card bloco"><div class="sub" style="font-weight:700">Na entrega</div><ul class="dicas"><li>Confira o nome de cada presente antes de entregar</li><li>Tire uma foto com a família, se ela deixar</li><li>Avise o responsável pela visita quando terminar</li></ul></div>`:`<div class="card bloco"><div class="sub" style="font-weight:700">Na conversa, anote</div><ul class="dicas"><li>Quem mora na casa e quantas pessoas são</li><li>Idade das crianças e o brinquedo que cada uma quer</li><li>O que mais precisam (cesta, presente, outro)</li><li>Confirme o endereço e o WhatsApp</li><li>Tire uma foto da fachada</li></ul></div>`}
   <p class="sub" style="text-align:center;margin-top:18px">Natal Social 2026 · CEAC</p>`;
}
addEventListener('hashchange',carregar);carregar();
</script>
</body></html>
