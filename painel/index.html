<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel · Natal Social 2026</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F4EF">
<link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap">
<link rel="stylesheet" href="painel.css">
</head><body>
<div class="wrap">
  <div class="topo">
    <div class="marca">
      <svg viewBox="0 0 200 82" fill="none" aria-hidden="true"><path d="M-2 72 H12 V50 L27 38 L42 50 V72 H49 V41 H74 V72 H80 V53 L96 39 L112 53 V72 H119 V47 H138 V36 H150 V72 H157 V51 L172 41 L187 51 V72 H202" stroke="var(--verde)" stroke-width="5" stroke-linejoin="round"/><rect x="22" y="54" width="8" height="8" fill="var(--janela)"/><rect x="93" y="56" width="8" height="8" fill="var(--janela)"/><rect x="166" y="56" width="8" height="8" fill="var(--janela)"/></svg>
      <div><b>Natal Social 2026</b><span>Painel da coordenação</span></div>
    </div>
    <div class="user" id="user"></div>
  </div>
  <div id="app"><p class="vazio" style="margin-top:30px">Carregando…</p></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,doc,onSnapshot,addDoc,setDoc,updateDoc,deleteDoc,getDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app=initializeApp({apiKey:"AIzaSyAfWGepsAcPbwQMVYLZyYtTH4BWglPfCmM",authDomain:"ceac-bsb.github.io",projectId:"natal-social-ceac",storageBucket:"natal-social-ceac.firebasestorage.app",messagingSenderId:"1014280497543",appId:"1:1014280497543:web:0a637ed96aa2a4ab1ecb22"});
const auth=getAuth(app),db=getFirestore(app);
const ADMIN='tiagomelolemos@gmail.com';
const SITE='https://ceac-bsb.github.io/natal-social/';
const SABADOS=['2026-11-07','2026-11-14','2026-11-21','2026-11-28','2026-12-05'];
const ENTREGA='2026-12-12';
const TIPO={reconhecimento:'Reconhecimento',entrega:'Entrega de Natal'};
const tipo=v=>v.tipo==='entrega'?'entrega':'reconhecimento';

// ---------- estado ----------
const S={user:null,admin:false,tes:false,acesso:{coordenadores:[],tesoureiros:[],equipe:[]},campanha:{familias:27,meta:20000,arrecadado:0,valorFamilia:1000},familias:[],visitas:[],voluntarios:[],doacoes:[]};
let aba='resumo',editando=false,unsub=[],filtroVol='';

// ---------- utilidades ----------
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dia=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'';
const hoje=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const digitos=z=>String(z||'').replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'');
const fone=z=>{z=digitos(z);return z.length>=10?`(${z.slice(0,2)}) ${z.slice(2,-4)}-${z.slice(-4)}`:(z||'sem número')};
const zap=(z,txt)=>`https://wa.me/55${digitos(z)}?text=${encodeURIComponent(txt)}`;
const primeiro=n=>String(n||'').trim().split(' ')[0];
const fam=id=>S.familias.find(x=>x.id===id),vol=id=>S.voluntarios.find(x=>x.id===id);
const token=()=>[...crypto.getRandomValues(new Uint8Array(15))].map(b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
async function copiar(t,m){try{await navigator.clipboard.writeText(t);toast(m)}catch{toast('Não deu para copiar: selecione o texto e copie.')}}
const falhou=e=>{console.error(e);toast(e?.code==='permission-denied'?'Sem permissão para isso.':'Não deu para salvar. Confira a internet e tente de novo.')};
const transp=p=>p.transporte==='carro'?`<span class="chip c-carro">🚗 carro${p.vagas?` · ${p.vagas} vagas`:''}</span>`:p.transporte==='carona'?`<span class="chip c-carona">precisa de carona</span>`:p.transporte==='proprio'?`<span class="chip c-neutro">vai por conta</span>`:'';
const casaSvg=`<svg viewBox="0 0 160 120" aria-label="Sem foto da fachada"><rect width="160" height="120" fill="var(--verde-claro)"/><path d="M40 92V58l40-28 40 28v34" fill="none" stroke="var(--verde)" stroke-width="5" stroke-linejoin="round"/><rect x="68" y="66" width="24" height="26" fill="none" stroke="var(--verde)" stroke-width="4"/></svg>`;
// crianças: uma linha por criança (nome, idade, menino/menina, brinquedo pedido)
const kidsDe=x=>Array.isArray(x?.kids)?x.kids:[];
const kidTxt=k=>`${k.nome||(k.sexo==='menina'?'Menina':k.sexo==='menino'?'Menino':'Criança')}${k.idade?`, ${k.idade} anos`:''}${k.brinquedo?` (${k.brinquedo})`:''}`;
const resumoKids=ks=>ks.length?`${ks.length} ${ks.length>1?'crianças':'criança'}: ${ks.map(kidTxt).join('; ')}`:'';
const kidLinha=(k={})=>`<div class="kid"><input class="k-nome" placeholder="Nome" value="${esc(k.nome||'')}" aria-label="Nome da criança"><input class="k-idade" type="number" min="0" max="17" placeholder="Idade" value="${k.idade??''}" aria-label="Idade"><select class="k-sexo" aria-label="Menino ou menina"><option value="">—</option><option value="menino" ${k.sexo==='menino'?'selected':''}>Menino</option><option value="menina" ${k.sexo==='menina'?'selected':''}>Menina</option></select><input class="k-brinq" placeholder="Brinquedo que pediu" value="${esc(k.brinquedo||'')}" aria-label="Brinquedo"><button type="button" class="kid-x" data-del-kid aria-label="Tirar esta criança">×</button></div>`;
const kidsEditor=(id,ks,antigo)=>`<div class="full"><div class="sub" style="font-weight:700;margin-bottom:6px">Crianças</div>${antigo&&!ks.length?`<p class="sub" style="margin:0 0 8px">Anotado antes: ${esc(antigo)}</p>`:''}<div class="kids" id="${id}">${(ks.length?ks:[{}]).map(kidLinha).join('')}</div><button type="button" class="btn peq" data-add-kid="${id}" style="margin-top:8px">+ Adicionar mais uma criança</button></div>`;
const lerKids=id=>[...document.querySelectorAll(`#${id} .kid`)].map(r=>({nome:r.querySelector('.k-nome').value.trim(),idade:r.querySelector('.k-idade').value===''?null:+r.querySelector('.k-idade').value,sexo:r.querySelector('.k-sexo').value,brinquedo:r.querySelector('.k-brinq').value.trim()})).filter(k=>k.nome||k.idade!==null||k.brinquedo);
const kidsHtml=f=>{const ks=kidsDe(f);return ks.length?ks.map(k=>esc(kidTxt(k))).join('<br>'):esc(f.criancas)||'—'};
// mensagem para a família (o mesmo texto vai no link do voluntário)
const hora=t=>t?String(t).replace(/^0?(\d+):00$/,'$1h').replace(/^0?(\d+):(\d\d)$/,'$1h$2'):'';
const quando=d=>{const n=(new Date(d+'T12:00')-new Date(hoje()+'T12:00'))/864e5;return n>=0&&n<7?`neste sábado (${dia(d)})`:`no sábado, ${dia(d)}`};
function msgFamilia(f,v){
  let t=`Oi, ${primeiro(f.resp)||f.nome||''}! Aqui é do Natal Social do CEAC.`;
  if(f.indicacao)t+=`\n${f.indicacao} passou seu contato.`;
  if(v){const h=hora(v.chegada||'10:00');t+=v.tipo==='entrega'?` Podemos levar a cesta e os presentes de Natal à sua casa ${quando(v.data)}, a partir das ${h}?`:` Podemos realizar uma visita à sua casa ${quando(v.data)}, a partir das ${h}?\nSe puder, mande também a sua localização fixa aqui pelo WhatsApp e o endereço completo, para a gente chegar certinho.`}
  return t;
}
// agendamento da família: {data,hora,estado:'aguardando'|'confirmada'}; vencido não conta
const agendaDe=f=>f.agenda&&f.agenda.data>=hoje()?f.agenda:null;
const tipoDaData=d=>d===ENTREGA?'entrega':'reconhecimento';
const visitaDaAgenda=a=>({tipo:tipoDaData(a.data),data:a.data,chegada:a.hora});
const quandoPerto=d=>{const n=(new Date(d+'T12:00')-new Date(hoje()+'T12:00'))/864e5;return n===0?'hoje':n===1?`amanhã (${dia(d)})`:quando(d)};
const msgConfirmar=(f,v)=>`Oi, ${primeiro(f.resp)||f.nome||''}! Aqui é do Natal Social do CEAC. Estou passando para confirmar ${tipo(v)==='entrega'?'a entrega da cesta e dos presentes':'a nossa visita'} ${quandoPerto(v.data)}, a partir das ${hora(v.chegada||'10:00')}. Podemos ir?`;
const msgCaminho=(f,v)=>`Oi, ${primeiro(f.resp)||f.nome||''}! Aqui é do Natal Social do CEAC. Já estamos a caminho da sua casa para ${tipo(v)==='entrega'?'a entrega':'a visita'}. Até já!`;
// grupos de visita (coleção visitas): {data,tipo,nome,lider,membros,familias,encontro,encontroMapa,saida,retorno,token,tokenLider,relatorios:{idFamília:relatório}}
// participante: coordenador ('c:email') ou voluntário aprovado ('v:id'); com d, só o voluntário que marcou esse sábado
const podeNoDia=(p,d)=>!d||d===ENTREGA||(p.sabados||[]).includes(d);
const participantes=d=>[...S.acesso.equipe.map(c=>({k:'c:'+c.email.toLowerCase(),nome:c.nome,zap:c.zap,coord:true})),...S.voluntarios.filter(p=>p.aprovado&&podeNoDia(p,d)).map(p=>({k:'v:'+p.id,nome:p.nome,zap:p.whatsapp,transporte:p.transporte,vagas:+p.vagas||0}))];
const pessoa=k=>participantes().find(p=>p.k===k);
const horaNo=(f,d)=>f.agenda?.data===d?f.agenda.hora||'':'';
const famsDo=g=>(g.familias||[]).map(fam).filter(Boolean).sort((a,b)=>horaNo(a,g.data).localeCompare(horaNo(b,g.data)));
const gruposDo=d=>S.visitas.filter(g=>g.data===d).sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','pt',{numeric:true}));
const grupoDaFam=(f,d)=>S.visitas.find(g=>g.data===d&&(g.familias||[]).includes(f.id));
const famsDia=d=>S.familias.filter(f=>f.agenda?.data===d||grupoDaFam(f,d)).sort((a,b)=>horaNo(a,d).localeCompare(horaNo(b,d))||(a.nome||'').localeCompare(b.nome||''));
const roteiroTxt=g=>famsDo(g).map((f,i)=>`${i+1}. ${hora(horaNo(f,g.data))||'horário a combinar'} · ${f.nome}${f.end?` · ${f.end}`:''}`).join('\n');
const fachada=f=>f?.foto?`<img src="${f.foto}" alt="Fachada da casa da ${esc(f.nome)}">`:casaSvg;

// ---------- login ----------
function telaEntrar(msg){
  $('#user').innerHTML='';
  $('#app').innerHTML=`<div class="entrar card"><svg viewBox="0 0 64 64" width="56"><rect width="64" height="64" rx="14" fill="#1D6B3A"/><path d="M14 50V29L32 14l18 15v21" fill="none" stroke="#F4F4EF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="26" y="31" width="12" height="11" rx="1.5" fill="#F2B33D"/><path d="M8 50h48" stroke="#F4F4EF" stroke-width="5" stroke-linecap="round"/></svg>
   <h1>Painel da coordenação</h1><p>${msg||'Entre com a sua conta Google. Só os coordenadores do Natal Social têm acesso.'}</p>
   <button class="btn pri" id="entrar">Entrar com Google</button>
   ${msg?'<p style="margin-top:14px"><button class="mini-link" id="sair2">Entrar com outra conta</button></p>':''}</div>`;
  $('#entrar').onclick=entrar;$('#sair2')&&($('#sair2').onclick=()=>signOut(auth));
}
async function entrar(){
  const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  try{await signInWithPopup(auth,p)}catch(e){if(e?.code==='auth/popup-blocked'||e?.code==='auth/operation-not-supported-in-this-environment')signInWithRedirect(auth,p);else if(e?.code!=='auth/popup-closed-by-user'&&e?.code!=='auth/cancelled-popup-request')toast('Não deu para entrar por este navegador. Abra o link no Safari (iPhone) ou no Chrome (Android).')}
}
getRedirectResult(auth).catch(()=>toast('Não deu para entrar. Tente de novo.'));
onAuthStateChanged(auth,async u=>{
  unsub.forEach(f=>f());unsub=[];S.user=u;
  if(!u){telaEntrar();return}
  const email=(u.email||'').toLowerCase();S.admin=email===ADMIN;
  $('#user').innerHTML=`${u.photoURL?`<img src="${u.photoURL}" alt="">`:''}<span>${esc(primeiro(u.displayName)||email)}</span><button id="sair">Sair</button>`;$('#sair').onclick=()=>signOut(auth);
  try{
    const a=await getDoc(doc(db,'config','acesso'));
    if(!a.exists()){
      if(!S.admin){telaEntrar(`O email ${esc(email)} ainda não tem acesso. Peça para o Tiago liberar.`);return}
      await setDoc(doc(db,'config','acesso'),{coordenadores:[ADMIN],tesoureiros:[ADMIN],equipe:[{nome:'Tiago Lemos',email:ADMIN,zap:'',tes:true}]});
    }
    const c=await getDoc(doc(db,'publico','campanha'));
    if(!c.exists()&&S.admin)await setDoc(doc(db,'publico','campanha'),{familias:27,meta:20000,arrecadado:0,valorFamilia:1000});
  }catch(e){telaEntrar(`O email ${esc(email)} ainda não tem acesso. Peça para o Tiago liberar.`);return}
  ouvir();
});
function ouvir(){
  const sub=(ref,fn)=>unsub.push(onSnapshot(ref,fn,e=>console.error(e)));
  sub(doc(db,'config','acesso'),s=>{S.acesso=Object.assign({coordenadores:[],tesoureiros:[],equipe:[]},s.data());const em=(S.user.email||'').toLowerCase();S.tes=S.admin||S.acesso.tesoureiros.includes(em);render()});
  sub(doc(db,'publico','campanha'),s=>{if(s.exists())S.campanha=s.data();render()});
  // visita arquivada (registro antigo, já juntado num grupo) fica guardada, fora da tela
  for(const k of ['familias','visitas','voluntarios','doacoes'])sub(collection(db,k),s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>!x.arquivada);if(k==='doacoes')conferirArrecadado();render()});
}
function conferirArrecadado(){
  if(!S.tes)return;const soma=S.doacoes.reduce((a,d)=>a+(d.tipo==='entrada'?+d.valor||0:0),0);
  if(soma!==(+S.campanha.arrecadado||0))setDoc(doc(db,'publico','campanha'),{arrecadado:soma,atualizado:serverTimestamp()},{merge:true}).catch(falhou);
}

// ---------- link da visita (o que o voluntário abre) ----------
const famLink=(f,d)=>({nome:f.nome||'',resp:f.resp||'',indicacao:f.indicacao||'',zap:digitos(f.zap),end:f.end||'',mapa:f.mapa||'',pessoas:+f.pessoas||0,criancas:f.criancas||'',kids:kidsDe(f),pedidos:f.pedidos||'',foto:f.foto||'',chegada:horaNo(f,d),confirmada:f.agenda?.data===d&&f.agenda.estado==='confirmada'});
// link da equipe (sem telefones) e link do líder (com os botões de mensagem)
function linkDoc(g,lider){
  const l=pessoa(g.lider)||{},eq=(g.membros||[]).filter(k=>k!==g.lider).map(pessoa).filter(Boolean);
  return {tipo:tipo(g),data:g.data,grupo:g.nome||'',saida:g.saida||'',retorno:g.retorno||'',encontro:g.encontro||'',encontroMapa:g.encontroMapa||'',
    responsavel:{nome:l.nome||'',zap:digitos(l.zap)},
    equipe:eq.map(p=>({nome:p.nome||'',transporte:p.transporte||'',vagas:p.vagas||0,...(lider?{zap:digitos(p.zap)}:{})})),
    familias:famsDo(g).map(f=>famLink(f,g.data)),
    ...(lider?{lider:true,linkEquipe:urlVisita(g)}:{}),
    atualizado:serverTimestamp()};
}
const urlVisita=g=>`${SITE}visita/#${g.token}`,urlLider=g=>`${SITE}visita/#${g.tokenLider}`;
const diaTxt=d=>{const n=(new Date(d+'T12:00')-new Date(hoje()+'T12:00'))/864e5;return n===0?`hoje (sábado, ${dia(d)})`:n===1?`amanhã (sábado, ${dia(d)})`:`no sábado, ${dia(d)}`};
function msgLider(g){
  const eq=(g.membros||[]).filter(k=>k!==g.lider).map(pessoa).filter(Boolean);
  return `Oi, ${primeiro(pessoa(g.lider)?.nome)}! Já designei aqui o grupo da sua visita e as suas visitas. Você é o responsável pelo ${g.nome} do Natal Social ${diaTxt(g.data)} 🎄\n\n${tipo(g)==='entrega'?'Entregas':'Famílias'}:\n${roteiroTxt(g)||'ainda vou definir'}\n\nSaída: ${g.saida} · ${g.encontro}\nRetorno previsto: ${g.retorno}\nVão com você: ${eq.map(p=>p.nome).join(', ')||'ainda vou definir'}\n\nSegue o link onde você consegue acessar isso de maneira fácil e ainda avisar as pessoas que vão com você sobre as visitas:\n${urlLider(g)}`;
}
function textoGrupo(g){
  const eq=(g.membros||[]).filter(k=>k!==g.lider).map(pessoa).filter(Boolean);
  return `🎄 ${g.nome} · ${TIPO[tipo(g)]} · Natal Social · sábado ${dia(g.data)}\nSaída: ${g.saida} · ${g.encontro}\nRetorno previsto: ${g.retorno}\nLíder: ${pessoa(g.lider)?.nome||'—'}\nVão: ${eq.map(p=>p.nome).join(', ')||'—'}\n\nFamílias:\n${roteiroTxt(g)}\n\nMapa, fotos das casas e contatos:\n${urlVisita(g)}`;
}

// ---------- telas ----------
function render(){
  if(!S.user||editando)return;
  const arr=+S.campanha.arrecadado||0,meta=+S.campanha.meta||0,pct=meta?Math.min(100,Math.round(arr/meta*100)):0;
  const pend=S.voluntarios.filter(p=>!p.aprovado).length,semRel=S.visitas.filter(g=>g.data<=hoje()).reduce((n,g)=>n+(g.familias||[]).filter(id=>fam(id)&&!g.relatorios?.[id]).length,0);
  const abas=[['resumo','Resumo'],['visitas','Sábados',semRel],['familias','Famílias'],['voluntarios','Voluntários',pend],['doacoes','Doações']];
  if(S.admin)abas.push(['acessos','Acessos']);
  let h=`<nav class="abas" aria-label="Seções">${abas.map(([k,n,c])=>`<button data-aba="${k}" class="${aba===k?'on':''}">${n}${c?`<span>${c}</span>`:''}</button>`).join('')}</nav>`;
  if(aba==='resumo'){
    const prox=S.visitas.filter(g=>g.data>=hoje()).sort((a,b)=>(a.data+a.saida+a.nome).localeCompare(b.data+b.saida+b.nome));
    const garantidas=S.campanha.valorFamilia?Math.min(S.campanha.familias,Math.floor(arr/S.campanha.valorFamilia)):0;
    h+=`<h2>Resumo</h2><div class="kpis">
      <div class="card kpi"><small>Meta de arrecadação</small><b>${pct}%</b><em>${brl(arr)} de ${brl(meta)}</em><div class="barra"><i style="width:${pct}%"></i></div></div>
      <div class="card kpi"><small>Famílias garantidas</small><b>${garantidas} de ${S.campanha.familias}</b><em>${brl(S.campanha.valorFamilia)} por família</em></div>
      <div class="card kpi"><small>Famílias cadastradas</small><b>${S.familias.length}</b><em>${S.familias.filter(f=>f.status&&f.status!=='visitar').length} visitadas · ${S.familias.filter(f=>f.status==='entregue').length} entregues</em></div>
      <div class="card kpi"><small>Voluntários</small><b>${S.voluntarios.length}</b><em>${pend} aguardando aprovação</em></div></div>
     <h2>Próximos grupos</h2><div class="grade">${prox.map(cardGrupo).join('')||'<p class="vazio">Nenhum grupo montado. Monte na aba Sábados.</p>'}</div>
     <h2>Coordenação</h2><div class="card">${S.acesso.equipe.map(c=>`<div class="linha"><div class="min"><b>${esc(c.nome)}</b><div class="sub">${esc(c.email)}${c.tes?' · lança doações':''}</div></div><span class="sub">${fone(c.zap)}</span></div>`).join('')||'<p class="vazio">Ninguém cadastrado.</p>'}</div>`;
  }
  if(aba==='visitas'){
    const dias=[...new Set([...SABADOS,ENTREGA,...S.visitas.map(g=>g.data),...S.familias.map(f=>f.agenda?.data).filter(Boolean)])].sort();
    const passados=dias.filter(d=>d<hoje()&&(gruposDo(d).length||famsDia(d).length)).reverse();
    h+=`<h2>Sábados</h2><p class="sub" style="margin-top:-6px">Designe as famílias para o sábado, monte os grupos e escolha o líder de cada um.</p>${dias.filter(d=>d>=hoje()).map(blocoDia).join('')}`;
    if(passados.length)h+=`<details style="margin-top:26px"><summary style="cursor:pointer;font-weight:700">Sábados que já passaram</summary>${passados.map(blocoDia).join('')}</details>`;
  }
  if(aba==='familias'){
    h+=`<h2>Famílias <button class="btn pri" data-acao="nova-familia">+ Cadastrar família</button></h2><div id="form-familia"></div>

  const r=v.relatorios?.[fid]||{},f=fam(fid)||{};
  return `<form class="cad" id="f-rel" data-v="${v.id}" data-f="${fid}" style="margin-top:12px;border-top:1px dashed var(--fio);padding-top:12px">
   <label class="f full">Como foi a visita<select id="r-status">${statusDo(v).map(k=>[k,STATUS_REL[k]]).map(([k,[n]])=>`<option value="${k}" ${r.status===k?'selected':''}>${n}</option>`).join('')}</select></label>
   <label class="f full">Relato<textarea id="r-texto" placeholder="Como a família recebeu, quem mora lá, o que chamou atenção, referência para achar a casa">${esc(r.texto||'')}</textarea></label>
   <label class="f">Pessoas na casa<input id="r-pes" type="number" min="1" value="${r.pessoas||f.pessoas||''}"></label>
   ${kidsEditor('r-kids',r.kids||kidsDe(f),f.criancas)}
   <label class="f full">Pedidos (atualizados)<textarea id="r-ped">${esc(r.pedidos||f.pedidos||'')}</textarea></label>
   <div class="full"><button class="btn pri" type="submit">Salvar relatório</button> <button class="btn" type="button" data-acao="fechar">Cancelar</button></div></form>`;
}
const sabadosVol=(id,marcados=[])=>`<fieldset class="full" style="border:0;padding:0;margin:0"><legend class="sub" style="font-weight:700;margin-bottom:6px">Sábados que pode ir</legend><div class="pessoas">${[...SABADOS,ENTREGA].map(s=>`<label class="chip c-neutro" style="cursor:pointer"><input type="checkbox" name="${id}" value="${s}" ${marcados.includes(s)?'checked':''} style="accent-color:var(--verde)"> ${dia(s)}${s===ENTREGA?' · entrega':''}</label>`).join('')}</div></fieldset>`;
function formVol(){
  return `<form class="card cad" id="f-vol" style="margin:12px 0"><label class="f">Nome<input id="nv-nome" required></label><label class="f">WhatsApp<input id="nv-zap" inputmode="tel" required></label>
   <label class="f">Como vai<select id="nv-t"><option value="carona">Precisa de carona</option><option value="carro">Tem carro e dá carona</option><option value="proprio">Vai por conta</option></select></label><label class="f">Vagas no carro<input id="nv-vagas" type="number" min="0" value="0"></label>
   ${sabadosVol('nv-sab')}
   <div class="full"><button class="btn pri" type="submit">Cadastrar já aprovado</button> <button class="btn" type="button" data-acao="fechar">Cancelar</button></div></form>`;
}
function abrir(sel,html){editando=true;$(sel).innerHTML=html;$(sel).querySelector('input,select,textarea')?.focus({preventScroll:true});$(sel).scrollIntoView({behavior:'smooth',block:'nearest'})}
function fechar(){editando=false;render()}

async function comprimir(arq){
  const url=URL.createObjectURL(arq);const img=new Image();img.src=url;await img.decode();
  const k=Math.min(1,900/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return c.toDataURL('image/jpeg',.72);
}
// a família fica em um grupo só por sábado; gid vazio tira de todos
async function moverFam(fid,d,gid){
  for(const g of gruposDo(d)){const tem=(g.familias||[]).includes(fid),quer=g.id===gid;if(tem!==quer){const fl=quer?[...(g.familias||[]),fid]:g.familias.filter(x=>x!==fid);await updateDoc(doc(db,'visitas',g.id),{familias:fl});g.familias=fl}}
  await syncLinks(g=>g.data===d);
}
async function salvarAgenda(fa,a){
  const antes=fa.agenda;
  await updateDoc(doc(db,'familias',fa.id),{agenda:a});fa.agenda=a;
  if(antes?.data&&antes.data!==a?.data&&antes.data>=hoje())await moverFam(fa.id,antes.data,'');
  await syncLinks(g=>(g.familias||[]).includes(fa.id));
}
async function syncLinks(filtro){
  for(const g of S.visitas.filter(filtro)){if(g.token)await setDoc(doc(db,'links',g.token),linkDoc(g,false)).catch(falhou);if(g.tokenLider)await setDoc(doc(db,'links',g.tokenLider),linkDoc(g,true)).catch(falhou)}
}

// ---------- eventos ----------
document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.aba){aba=t.dataset.aba;editando=false;render();return}
  if(t.dataset.filtroVol!==undefined){filtroVol=t.dataset.filtroVol;render();return}
  if(t.dataset.acao==='fechar'){fechar();return}
  if(t.dataset.novoGrupo){abrir('#ng-'+t.dataset.novoGrupo,formGrupo(t.dataset.novoGrupo));return}
  if(t.dataset.acao==='nova-familia'){abrir('#form-familia',formFamilia());return}
  if(t.dataset.acao==='novo-vol'){abrir('#form-vol',formVol());return}
  if(t.dataset.propor){abrir('#ef-'+t.dataset.propor,formPropor(fam(t.dataset.propor)));return}
  if(t.dataset.confirmar){const fa=fam(t.dataset.confirmar);salvarAgenda(fa,{...fa.agenda,estado:'confirmada'}).then(()=>{toast('Confirmado. Coloque a família num grupo na aba Sábados.');render()}).catch(falhou);return}
  if(t.dataset.sabVol){const p=vol(t.dataset.sabVol);abrir('#sv-'+p.id,`<form class="cad" id="f-sab" data-id="${p.id}" style="margin:0 0 12px">${sabadosVol('sv-sab',p.sabados||[])}<div class="full"><button class="btn pri" type="submit">Salvar sábados</button> <button class="btn" type="button" data-acao="fechar">Cancelar</button></div></form>`);return}
  if(t.dataset.editFam){abrir('#ef-'+t.dataset.editFam,formFamilia(fam(t.dataset.editFam)));return}
  if(t.dataset.editGrupo){const g=S.visitas.find(x=>x.id===t.dataset.editGrupo);abrir('#eg-'+g.id,formGrupo(g.data,g));return}
  if(t.dataset.relatorio){abrir(`#rel-${t.dataset.relatorio}-${t.dataset.fam}`,formRelatorio(S.visitas.find(v=>v.id===t.dataset.relatorio),t.dataset.fam));return}
  if(t.dataset.msgLider){copiar(msgLider(S.visitas.find(g=>g.id===t.dataset.msgLider)),'Mensagem do líder copiada.');return}
  if(t.dataset.grupo){copiar(textoGrupo(S.visitas.find(v=>v.id===t.dataset.grupo)),'Mensagem copiada. Cole onde quiser.');return}
  if(t.dataset.aprovar){updateDoc(doc(db,'voluntarios',t.dataset.aprovar),{aprovado:true}).then(()=>toast('Aprovado. Agora ele pode entrar num grupo.')).catch(falhou);return}
  if(t.dataset.addKid){const box=$('#'+t.dataset.addKid);box.insertAdjacentHTML('beforeend',kidLinha());box.lastElementChild.querySelector('input').focus();return}
  if(t.dataset.delKid!==undefined){const box=t.closest('.kids'),row=t.closest('.kid');if(box.children.length>1)row.remove();else row.querySelectorAll('input,select').forEach(i=>i.value='');return}
  if(t.id==='ff-gps'){if(!navigator.geolocation){toast('Este aparelho não dá a localização.');return}toast('Pegando a localização…');navigator.geolocation.getCurrentPosition(p=>{$('#ff-mapa').value=`https://maps.google.com/?q=${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`;toast('Localização da casa salva no campo.')},()=>toast('Não deu para pegar a localização. Libere o acesso no navegador.'),{enableHighAccuracy:true,timeout:15000});return}
  // apagar: pede um segundo toque no mesmo botão
  const apagar=async(fn,msg)=>{if(t.dataset.certeza){await fn().then(()=>{toast(msg);fechar()}).catch(falhou)}else{t.dataset.certeza=1;t.textContent='Toque de novo para confirmar';setTimeout(()=>{delete t.dataset.certeza},4000)}};
  if(t.dataset.delVol)return apagar(()=>deleteDoc(doc(db,'voluntarios',t.dataset.delVol)),'Voluntário removido.');
  if(t.dataset.delDoacao)return apagar(()=>deleteDoc(doc(db,'doacoes',t.dataset.delDoacao)),'Lançamento apagado.');
  if(t.dataset.delFam)return apagar(()=>deleteDoc(doc(db,'familias',t.dataset.delFam)),'Família apagada.');
  if(t.dataset.delGrupo){const g=S.visitas.find(x=>x.id===t.dataset.delGrupo);return apagar(async()=>{for(const k of [g.token,g.tokenLider])if(k)await deleteDoc(doc(db,'links',k));await deleteDoc(doc(db,'visitas',g.id))},'Grupo apagado. As famílias continuam designadas para o sábado.')}
  if(t.dataset.tirarAg){const fa=fam(t.dataset.tirarAg);return apagar(()=>salvarAgenda(fa,null),'Agendamento tirado.')}
  if(t.dataset.delAcesso){const eq=S.acesso.equipe.filter((_,i)=>i!=t.dataset.delAcesso);return apagar(()=>salvarAcesso(eq),'Acesso retirado.')}
});
document.addEventListener('change',async e=>{
  const ds=e.target.dataset;
  if(ds.designar&&e.target.value){const fa=fam(e.target.value);salvarAgenda(fa,{data:ds.designar,hora:'10:00',estado:'confirmada'}).then(()=>toast(`${fa.nome} designada para ${dia(ds.designar)}. Ajuste o horário e o grupo.`)).catch(falhou)}
  if(ds.horaFam){const fa=fam(ds.horaFam),a=fa.agenda?.data===ds.dia?fa.agenda:{data:ds.dia,estado:'confirmada'};salvarAgenda(fa,{...a,hora:e.target.value}).then(()=>toast('Horário salvo.')).catch(falhou)}
  if(ds.grupoFam)moverFam(ds.grupoFam,ds.dia,e.target.value).then(()=>{toast(e.target.value?'Família colocada no grupo.':'Família tirada do grupo.');render()}).catch(falhou);
  if(e.target.id==='ff-foto'&&e.target.files[0]){try{const d=await comprimir(e.target.files[0]);e.target.dataset.foto=d;$('#ff-prev').src=d;$('#ff-prev').hidden=false}catch{toast('Não deu para ler essa foto.')}}
  if(e.target.dataset.tes!==undefined){const eq=S.acesso.equipe.map((c,i)=>i==e.target.dataset.tes?{...c,tes:e.target.checked}:c);salvarAcesso(eq).then(()=>toast('Acesso atualizado.')).catch(falhou)}
});
function salvarAcesso(eq){
  return setDoc(doc(db,'config','acesso'),{equipe:eq,coordenadores:[...new Set([ADMIN,...eq.map(c=>c.email.toLowerCase())])],tesoureiros:[...new Set([ADMIN,...eq.filter(c=>c.tes).map(c=>c.email.toLowerCase())])]});
}
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,btn=f.querySelector('[type=submit]');btn&&(btn.disabled=true);
  try{
    if(f.id==='f-familia'){
      const d={nome:$('#ff-nome').value.trim()||'Família sem nome',resp:$('#ff-resp').value.trim(),zap:digitos($('#ff-zap').value),pessoas:+$('#ff-pes').value||0,kids:lerKids('ff-kids'),end:$('#ff-end').value.trim(),indicacao:$('#ff-ind').value.trim(),obs:$('#ff-obs').value.trim(),mapa:$('#ff-mapa').value.trim(),pedidos:$('#ff-ped').value.trim(),status:$('#ff-st').value};
      d.criancas=resumoKids(d.kids)||(f.dataset.id?fam(f.dataset.id)?.criancas||'':'');
      if($('#ff-foto').dataset.foto)d.foto=$('#ff-foto').dataset.foto;
      if(f.dataset.id){await updateDoc(doc(db,'familias',f.dataset.id),d);Object.assign(fam(f.dataset.id),d);await syncLinks(g=>(g.familias||[]).includes(f.dataset.id))}
      else await addDoc(collection(db,'familias'),{...d,criadoPor:S.user.displayName||S.user.email,criadoEm:serverTimestamp()});
      toast('Família salva.');fechar();
    }
    if(f.id==='f-propor'){
      const fa=fam(f.dataset.id),a={data:$('#p-data').value,hora:$('#p-hora').value,estado:e.submitter?.value==='ja'?'confirmada':'aguardando'};
      if(a.estado==='aguardando')window.open(zap(fa.zap,msgFamilia(fa,visitaDaAgenda(a))),'_blank','noopener');
      await salvarAgenda(fa,a);
      toast(a.estado==='confirmada'?'Confirmado. Coloque a família num grupo na aba Sábados.':'Proposta salva. Quando a família responder, toque em Confirmado.');fechar();
    }
    if(f.id==='f-grupo'){
      const d=f.dataset.dia,old=S.visitas.find(x=>x.id===f.dataset.id),lider=$('#g-lider').value;
      const familias=[...f.querySelectorAll('[name=g-fam]:checked')].map(x=>x.value);
      const g={data:d,tipo:tipoDaData(d),nome:$('#g-nome').value.trim()||'Grupo',lider,membros:[...new Set([lider,...[...f.querySelectorAll('[name=g-membro]:checked')].map(x=>x.value)].filter(Boolean))],familias,
        encontro:$('#g-enc').value.trim(),encontroMapa:$('#g-encmapa').value.trim(),saida:$('#g-saida').value,retorno:$('#g-ret').value,token:old?.token||token(),tokenLider:old?.tokenLider||token()};
      for(const o of gruposDo(d))if(o.id!==old?.id&&(o.familias||[]).some(id=>familias.includes(id))){const fl=o.familias.filter(id=>!familias.includes(id));await updateDoc(doc(db,'visitas',o.id),{familias:fl});o.familias=fl}
      if(old){await updateDoc(doc(db,'visitas',old.id),g);Object.assign(old,g)}else{const r=await addDoc(collection(db,'visitas'),{...g,relatorios:{},criadoEm:serverTimestamp()});S.visitas.push({id:r.id,...g,relatorios:{}})}
      await syncLinks(x=>x.data===d);
      toast(old?'Grupo salvo. Os links já estão atualizados.':'Grupo criado. Mande o link pro líder.');fechar();
    }
    if(f.id==='f-rel'){
      const v=S.visitas.find(x=>x.id===f.dataset.v),fa=fam(f.dataset.f);
      const r={status:$('#r-status').value,texto:$('#r-texto').value.trim()||'—',pessoas:+$('#r-pes').value||0,kids:lerKids('r-kids'),pedidos:$('#r-ped').value.trim(),autor:S.user.displayName||S.user.email,data:hoje()};
      await updateDoc(doc(db,'visitas',v.id),{[`relatorios.${f.dataset.f}`]:r});
      if(fa){const up={};if(r.pessoas)up.pessoas=r.pessoas;if(r.kids.length){up.kids=r.kids;up.criancas=resumoKids(r.kids)}if(r.pedidos)up.pedidos=r.pedidos;if(r.status==='feita'&&fa.status!=='entregue')up.status='visitada';if(r.status==='entregue')up.status='entregue';await updateDoc(doc(db,'familias',fa.id),up);Object.assign(fa,up);await syncLinks(g=>(g.familias||[]).includes(fa.id))}
      toast('Relatório salvo. A ficha da família foi atualizada.');fechar();
    }
    if(f.id==='f-sab'){
      await updateDoc(doc(db,'voluntarios',f.dataset.id),{sabados:[...f.querySelectorAll('[name=sv-sab]:checked')].map(x=>x.value)});
      toast('Sábados salvos.');fechar();
    }
    if(f.id==='f-vol'){
      await addDoc(collection(db,'voluntarios'),{nome:$('#nv-nome').value.trim(),whatsapp:digitos($('#nv-zap').value),email:'',sabados:[...f.querySelectorAll('[name=nv-sab]:checked')].map(x=>x.value),transporte:$('#nv-t').value,vagas:+$('#nv-vagas').value||0,aprovado:true,criadoEm:serverTimestamp()});
      toast('Voluntário cadastrado.');fechar();
    }
    if(f.id==='f-doacao'){
      const valor=parseFloat($('#d-valor').value.replace(/\./g,'').replace(',','.'));if(!valor){toast('Informe um valor.');btn.disabled=false;return}
      await addDoc(collection(db,'doacoes'),{tipo:$('#d-tipo').value,valor,quem:$('#d-quem').value.trim(),data:$('#d-data').value||hoje(),por:primeiro(S.user.displayName)||S.user.email,criadoEm:serverTimestamp()});
      toast('Lançado. A meta da página pública atualiza junto.');f.reset();$('#d-data').value=hoje();btn.disabled=false;
    }
    if(f.id==='f-meta'){
      const n=s=>parseFloat(String(s).replace(/\./g,'').replace(',','.'))||0;
      await setDoc(doc(db,'publico','campanha'),{meta:n($('#m-meta').value),familias:+$('#m-fam').value||27,valorFamilia:n($('#m-vf').value),atualizado:serverTimestamp()},{merge:true});
      toast('Meta salva.');
    }
    if(f.id==='f-acesso'){
      const email=$('#a-email').value.trim().toLowerCase();
      if(S.acesso.equipe.some(c=>c.email===email)){toast('Esse email já tem acesso.');btn.disabled=false;return}
      await salvarAcesso([...S.acesso.equipe,{nome:$('#a-nome').value.trim(),email,zap:digitos($('#a-zap').value),tes:$('#a-tes').checked}]);
      toast('Acesso liberado. Já pode entrar com esse email.');
    }
  }catch(err){falhou(err);btn&&(btn.disabled=false)}
});
</script>
